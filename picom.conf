fading = true

fade-in-step = 0.05;
fade-out-step = 0.05;

fade-exclude = [
  "class_g = 'slop'",
  "class_g = 'jgmenu'",
]

no-fading-openclose = true
no-fading-destroyed-argb = true

blur-kern="3x3box"
blur-method="dual_kawase"
blur-strength=4
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'menu'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c"
];

daemon = true
backend = "glx"

corner-radius = 4;
round-borders = 1;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3lock'",
]

vsync = true

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true
detect-client-leader = true

use-damage = false
force-win-blend = true
log-level = "warn";

opacity-rule = [
  "85:class_g = 'Alacritty'",
  "85:class_g = 'st-256color'"
]

shadow-exclude = [ "class_g = 'Google-chrome-unstable' && (window_type = 'popup_menu' || window_type = 'utility')", ]
blur-exclude = [ "class_g = 'Google-chrome-unstable' && (window_type = 'popup_menu' || window_type = 'utility')", ]


wintypes:
{
  tooltip = { fade = false; shadow = false; blur = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; opacity = 1.0; full-shadow = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; fade = false; blur = false; shadow = false; }
  dropdown_menu = { opacity = 1.0; fade = false; blur = false; shadow = false; }
  menu = { shadow = false; fade = false; blur = false; opacity = 1.0; }
};

