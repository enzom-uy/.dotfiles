# Keymaps

bindsym $mod+shift+w exec google-chrome-unstable
bindsym $mod+shift+f exec nemo
bindsym $mod+shift+d exec discord-canary
bindsym $mod+a exec --no-startup-id flameshot gui
bindsym $mod+n exec --no-startup-id notion-app

# Workspaces

assign [class="kitty"] $ws1
assign [class="Alacritty"] $ws1
assign [class="Code - Insiders"] $ws1

assign [class="firefox"] $ws2
assign [class="Google-chrome-unstable"] $ws2
assign [class="Chromium"] $ws9
assign [class="Sidekick-browser"] $ws2
assign [class="Brave-browser-nightly"] $ws2


assign [class="Nautilus"] $ws4
assign [class="Thunar"] $ws4
assign [class="Nemo"] $ws4

assign [class="figma-linux"] $ws5
assign [class="obsidian"] $ws5
assign [class="Notion"] $ws5


assign [class="Slack"] $ws6
assign [class="discord"] $ws6

assign [class="vlc"] $ws7
assign [class="Spotify"] $ws7

assign [class="obs"] $ws9
