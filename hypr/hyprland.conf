$mainMod = SUPER

source = ~/.config/hypr/config/keybinds.conf
source = ~/.config/hypr/config/autostart.conf
source = ~/.config/hypr/config/windowrules.conf
source = ~/.config/hypr/themes/mocha.conf

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor = DP-1, 2560x1440@180,auto, 1, bitdepth, 10
monitor = HDMI-1, 1920x1080@75,auto, 1, bitdepth, 10

# Environtment
env = HYPRLAND_LOG_WLR, 1
env = HYPRLAND_NO_RT, 1
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = WLR_DRM_NO_ATOMIC,1
env = NVD_BACKEND,direct
env = QT_QPA_PLATFORMTHEME,kde

input {
	kb_layout = us
	kb_variant = altgr-intl
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1
	repeat_delay = 250
	repeat_rate = 30

	sensitivity = 0
	force_no_accel = 1
}

general {
    border_size = 3
    # gaps_in = 3
    # gaps_out = 8,6
    resize_on_border = true
    extend_border_grab_area = 30
    layout = dwindle #master dwindle
    allow_tearing = true
    gaps_workspaces = 0
    col.active_border = rgb(88BC95) #rgb(FFA237)
    # col.inactive_border = none
}

decoration {
    active_opacity = 1
    inactive_opacity = 1
    rounding = 10
    rounding_power = 2
    dim_inactive = false
    dim_strength = 0.05
    blur {
        enabled = true
        size = 3 #
        passes = 2  #3
        new_optimizations = on
        ignore_opacity = on
        popups = true
    }
    shadow {
        enabled = true
        range = 4
        render_power = 2 # 1- 4
        sharp = false
        ignore_window = true
        offset = 3, 4
        scale = 1.0 # 0.0 - 1.0 
        color = rgba(1a1a1aee)

    }
}

animations {
    enabled = true
    animation = workspaces, 1, 3.5, default, slide
    animation = windows, 1, 4, default, popin
    animation = fade, 0
}

dwindle {
    preserve_split = yes 
    pseudotile = yes
}

misc {
    disable_hyprland_logo = true
    vfr = false
    vrr = 2
}

cursor {
	hide_on_key_press = true
}

submap=alttab
bind = ALT, tab, sendshortcut, , tab, class:alttab
bind = ALT SHIFT, tab, sendshortcut, shift, tab, class:alttab

bindrt = ALT, ALT_L, exec, ~/.config/hypr/scripts/alttab/disable.sh ; hyprctl -q dispatch sendshortcut ,return,class:alttab
bind = ALT, escape, exec, ~/.config/hypr/scripts/alttab/disable.sh ; hyprctl -q dispatch sendshortcut ,escape,class:alttab
submap = reset

workspace = special:alttab, gapsout:0, gapsin:0, bordersize:0

# Idle Neofetch
windowrule {
    name = hypr-idle-neofetch
    match:class = ^(hypr-idle-neofetch)$
    float = true
    center = true
    no_focus = true
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}
